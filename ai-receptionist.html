<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/favicon.png">
<title>Redline AI Receptionist</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: same "Dyno Night" system as the main site; one call console in the middle, live transcript beside it. */
:root{
  --ink:#0c0a0b;--panel:#161214;--panel-2:#1e191b;--line:#2e2629;--fg:#f3eeee;--muted:#a89da0;
  --red:#e10600;--red-hi:#ff3a2e;--ok:#3ccf7a;--amber:#ffb020;
  --f-display:"Oswald","Arial Narrow",Impact,sans-serif;--f-body:"Manrope",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--fg);font:16px/1.6 var(--f-body)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0}
.eyebrow{font:500 .78rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--red-hi)}
.lead{color:var(--muted);max-width:60ch}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.top{display:flex;align-items:center;gap:12px;padding-block:16px;border-bottom:1px solid var(--line)}
.top b{font-family:var(--f-display);font-size:1.3rem}.top b span{color:var(--red)}
.langs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.langs button{background:none;border:0;color:var(--muted);font:700 .78rem var(--f-mono);padding:8px 9px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--red);color:#fff}
.hero{padding-block:48px 24px;display:grid;gap:14px}
.hero h1{font-size:clamp(2.4rem,7vw,4.4rem)}
.hero h1 em{font-style:normal;color:var(--red)}
.console{display:grid;gap:20px;padding-block:24px 56px}
@media(min-width:860px){.console{grid-template-columns:.9fr 1.1fr}}
.phone{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;display:grid;gap:18px;justify-items:center;text-align:center;align-content:start}
.status{font:700 .8rem var(--f-mono);display:flex;align-items:center;gap:8px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(60,207,122,.15)}
.callbtn{width:132px;height:132px;border-radius:50%;border:0;background:var(--red);color:#fff;cursor:pointer;display:grid;place-items:center;font:700 .95rem var(--f-body);gap:4px;box-shadow:0 0 0 10px rgba(225,6,0,.12),0 0 0 22px rgba(225,6,0,.06)}
.callbtn:hover{background:var(--red-hi)}
.callbtn.live{background:#2a1515;border:2px solid var(--red);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 18px rgba(225,6,0,.05),0 0 0 30px rgba(225,6,0,.02)}}
@media(prefers-reduced-motion:reduce){.callbtn.live{animation:none}}
.callbtn svg{width:40px;height:40px}
.timer{font:700 1.6rem var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:.82rem;color:var(--muted)}
.fallback{font:700 1.1rem var(--f-mono);user-select:all}
.log{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:12px;align-content:start;min-height:360px}
.log h3{font-size:1rem;letter-spacing:.06em;color:var(--muted)}
.msg{max-width:88%;padding:10px 14px;border-radius:12px;font-size:.95rem}
.msg.ai{background:var(--panel-2);border:1px solid var(--line);justify-self:start}
.msg.cl{background:#2a1212;border:1px solid #4a1d1b;justify-self:end}
.msg small{display:block;font:700 .68rem var(--f-mono);color:var(--muted);margin-bottom:2px;letter-spacing:.08em}
.booked{border:1px solid #1f5a35;background:#0f1f15;border-radius:12px;padding:14px;display:grid;gap:6px;font-family:var(--f-mono);font-size:.88rem}
.booked b{color:var(--ok)}
.feat{display:grid;gap:16px;padding-block:8px 64px}
@media(min-width:760px){.feat{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.feat{grid-template-columns:repeat(4,1fr)}}
.feat div{border-top:3px solid var(--red);padding-top:14px;display:grid;gap:6px}
.feat p{color:var(--muted);font-size:.95rem}
footer{border-top:1px solid var(--line);padding-block:24px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>

<!--
  INTEGRATION (Retell web call) — replace the demo in startCall()/endCall():
  1. Backend endpoint (e.g. Hostinger PHP or a Vercel function) calls
     POST https://api.retellai.com/v2/create-web-call  with {agent_id:"YOUR_AGENT_ID"} and your Retell API key (server side only).
  2. Load the client SDK: <script src="https://cdn.jsdelivr.net/npm/retell-client-js-sdk@<pinned-version>/dist/index.umd.js"></script>
  3. const client = new RetellWebClient(); await client.startCall({ accessToken });  client.on("update", u => renderTranscript(u.transcript));
  4. Phone line: point the shop's number (or a forwarded after-hours number) to the same Retell agent.
-->

<div class="wrap top">
  <b><span>RED</span>LINE · AI</b>
  <div class="langs" role="group" aria-label="Language"><button type="button" data-lang="bg">BG</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="tr">TR</button><button type="button" data-lang="ro">RO</button></div>
</div>

<main class="wrap">
  <section class="hero">
    <p class="eyebrow">24/7 · AI receptionist</p>
    <h1 data-i18n="h"></h1>
    <p class="lead" data-i18n="p"></p>
  </section>

  <section class="console">
    <div class="phone">
      <span class="status"><i class="dot"></i><span data-i18n="online"></span></span>
      <button class="callbtn" id="callBtn" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>
        <span id="callLabel" data-i18n="call"></span>
      </button>
      <span class="timer" id="timer">00:00</span>
      <p class="small" data-i18n="demo"></p>
      <p class="small" data-i18n="or"></p>
      <span class="fallback">087 621 2811</span>
    </div>
    <div class="log" id="log" aria-live="polite">
      <h3 data-i18n="log_h"></h3>
      <p class="small" id="logEmpty" data-i18n="log_empty"></p>
    </div>
  </section>

  <section class="feat">
    <div><h3 data-i18n="f1t"></h3><p data-i18n="f1d"></p></div>
    <div><h3 data-i18n="f2t"></h3><p data-i18n="f2d"></p></div>
    <div><h3 data-i18n="f3t"></h3><p data-i18n="f3d"></p></div>
    <div><h3 data-i18n="f4t"></h3><p data-i18n="f4d"></p></div>
  </section>
</main>
<footer><div class="wrap" data-i18n="foot"></div></footer>

let L="bg",live=false,timers=[],tick=null,sec=0;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],t=k=>T[L][k];
function apply(l){L=T[l]?l:"bg";document.documentElement.lang=L;
  $$("[data-i18n]").forEach(e=>e.innerHTML=t(e.dataset.i18n));
  if(live)$("#callLabel").textContent=t("end");
  $$(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===L));
  try{localStorage.setItem("rl_lang",L)}catch(e){}}
$$(".langs button").forEach(b=>b.onclick=()=>{if(live)endCall();apply(b.dataset.lang)});
function add(html){const e=$("#logEmpty");if(e)e.hidden=true;const d=document.createElement("div");d.innerHTML=html;$("#log").appendChild(d.firstElementChild)}
function clearLog(){$$("#log .msg,#log .booked").forEach(e=>e.remove());$("#logEmpty").hidden=false}
function startCall(){ /* DEMO — replace with Retell web call (see comment at top) */
  live=true;clearLog();sec=0;$("#timer").textContent="00:00";
  const b=$("#callBtn");b.classList.add("live");b.setAttribute("aria-pressed","true");$("#callLabel").textContent=t("end");
  tick=setInterval(()=>{sec++;$("#timer").textContent=String(sec/60|0).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")},1000);
  t("script").forEach(([who,txt],i)=>timers.push(setTimeout(()=>add(`<div class="msg ${who}"><small>${who==="ai"?"AI":"👤"}</small>${txt}</div>`),900+i*1700)));
  const bk=t("book");
  timers.push(setTimeout(()=>{add(`<div class="booked"><b>✓ ${bk[0]}</b><span>${bk[1]}</span><span>${bk[2]}</span><span>${bk[3]}</span></div>`);endCall(true)},900+t("script").length*1700));
}
function endCall(keep){live=false;timers.forEach(clearTimeout);timers=[];clearInterval(tick);
  const b=$("#callBtn");b.classList.remove("live");b.setAttribute("aria-pressed","false");$("#callLabel").textContent=t("call")}
$("#callBtn").onclick=()=>live?endCall():startCall();
let s=null;try{s=localStorage.getItem("rl_lang")}catch(e){}
const n=(navigator.language||"bg").slice(0,2);apply(s||(T[n]?n:"bg"));
</script>

</html>
